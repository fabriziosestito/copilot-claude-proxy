version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: copilot-claude-proxy
    main: ./cmd/copilot-claude-proxy
    binary: copilot-claude-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: copilot-claude-proxy
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - name: copilot-claude-proxy
    directory: HomebrewFormula
    homepage: "https://github.com/fabriziosestito/copilot-claude-proxy"
    description: "Expose GitHub Copilot as an Anthropic-compatible API for Claude Code"
    license: "GPL-3.0"
    commit_msg_template: "chore: update brew formula for {{ .Tag }}"
    repository:
      owner: fabriziosestito
      name: copilot-claude-proxy
    test: |
      system "#{bin}/copilot-claude-proxy --version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
