version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait for new releases to age before updating, to avoid pulling in
    # freshly published (potentially compromised) versions.
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        # Keep majors out of the group so they arrive as individual PRs
        # for manual review, and the grouped PR can always auto-merge.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
